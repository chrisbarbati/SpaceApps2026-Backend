### Only non-sensitive properties go in this file, sensitive ones are imported from an outside directory
spring.config.import=file:${user.home}/.secrets/SpaceApps2026/SpaceApps2026-Backend/application.properties

logging.level.root=INFO
logging.level.org.greenalienhouseparty=TRACE

# Which planner serves POST /crop-optimization:
#   random  - placeholder that picks crops at random (default)
#   dynamic - optimizer for soil health and crop reliability, using field data
#   mock    - varied illustrative plans for demonstrations; not calculated from field data
crop.planner.strategy=random

# Only chat is used; the other OpenAI model types would each need their own client.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# Low, explicit temperature: answers should stick to the data (Spring AI 2.0 sets no default).
spring.ai.openai.chat.temperature=0.2
# Fail fast so a fallback model can take over instead of waiting through long retries.
spring.ai.openai.max-retries=1
spring.ai.openai.timeout=90s
# Errors from tools are sent back to the model so it can explain them, not thrown.
spring.ai.tools.throw-exception-on-error=false
spring.ai.tools.limits.max-total-tool-calls=25
spring.ai.tools.limits.max-calls-per-tool-default=6
spring.ai.tools.limits.on-limit-exceeded=return-error-response
# Messages remembered per conversation.
chat.memory.max-messages=20
# Streamed replies can include slow satellite lookups; the servlet default timeout is too short.
spring.mvc.async.request-timeout=5m
