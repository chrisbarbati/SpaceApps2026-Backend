### Only non-sensitive properties go in this file, sensitive ones are imported from an outside directory
spring.config.import=file:${user.home}/.secrets/SpaceApps2026/SpaceApps2026-Backend/application.properties

logging.level.root=INFO
logging.level.org.greenalienhouseparty=TRACE

# Which planner serves POST /crop-optimization:
#   random  - placeholder that picks crops at random (default)
#   dynamic - optimizer for soil health and crop reliability, using field data
#   mock    - varied illustrative plans for demonstrations; not calculated from field data
crop.planner.strategy=random
